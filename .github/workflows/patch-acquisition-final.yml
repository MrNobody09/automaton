name: Apply final acquisition correctness patch

on:
  push:
    branches: [feat/opportunity-acquisition]
    paths: [.github/workflows/patch-acquisition-final.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opportunity-acquisition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply final acquisition correctness changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch target not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/business/acquisition.ts",
              '''function parseUsdAmount(text: string, ceilingUsd: number): number | null {\n  const matches: number[] = [];\n  const patterns = [\n    /\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)/g,\n    /\\b([0-9][0-9,]*(?:\\.[0-9]{1,2})?)\\s*(?:USD|USDC)\\b/gi,\n  ];\n  for (const pattern of patterns) {\n    for (const match of text.matchAll(pattern)) {\n      const value = Number(match[1].replace(/,/g, ""));\n      if (Number.isFinite(value) && value > 0 && value <= ceilingUsd) matches.push(value);\n    }\n  }\n  if (matches.length === 0) return null;\n  return Math.max(...matches);\n}\n''',
              '''function parseUsdAmount(text: string, ceilingUsd: number): number | null {\n  const payoutContext = /\\b(?:bounty|reward|payout|payment|compensation|prize|pays?|paid)\\b/i;\n  const segments = text\n    .split(/\\n+|(?<=[.!?])\\s+/)\n    .map((segment) => segment.trim())\n    .filter((segment) => segment && payoutContext.test(segment));\n  const matches: number[] = [];\n  const patterns = [\n    /\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)/g,\n    /\\b([0-9][0-9,]*(?:\\.[0-9]{1,2})?)\\s*(?:USD|USDC)\\b/gi,\n  ];\n  for (const segment of segments) {\n    for (const pattern of patterns) {\n      pattern.lastIndex = 0;\n      for (const match of segment.matchAll(pattern)) {\n        const value = Number(match[1].replace(/,/g, ""));\n        if (Number.isFinite(value) && value > 0 && value <= ceilingUsd) matches.push(value);\n      }\n    }\n  }\n  if (matches.length === 0) return null;\n  return Math.max(...matches);\n}\n''',
          )

          replace_once(
              "src/heartbeat/daemon.ts",
              '''      timeoutMs: 30_000,\n      maxRetries: 1,''',
              '''      timeoutMs: entry.name === OPPORTUNITY_DISCOVERY_TASK_NAME ? 180_000 : 30_000,\n      maxRetries: 1,''',
          )

          # Add a regression test after the existing GitHub reward non-invention test block.
          p = Path("src/__tests__/opportunity-acquisition.test.ts")
          text = p.read_text()
          marker = '''  it("isolates a failing enabled source from other discovery sources", async () => {'''
          test = '''  it("does not mistake unrelated dollar amounts for bounty revenue", async () => {\n    const db = memoryDb();\n    configureOpportunitySource(db, {\n      id: "github-curated",\n      name: "Curated GitHub work",\n      type: "github_issues",\n      enabled: true,\n      config: { repositories: ["example/project"], labels: ["bounty"] },\n    });\n\n    await runOpportunityDiscovery(\n      db,\n      "github-curated",\n      mockFetch({\n        items: [\n          {\n            number: 8,\n            title: "Optimize hosted export worker",\n            body: "Current monthly infrastructure cost is $500. Maintainer has not announced the payout amount.",\n            html_url: "https://github.com/example/project/issues/8",\n            comments: 1,\n            labels: [{ name: "bounty" }],\n          },\n        ],\n      }),\n    );\n\n    const opportunity = getOpportunityPipeline(db)[0];\n    expect(opportunity.estimatedRevenueCents).toBe(0);\n    expect(opportunity.demandEvidence).toContain("no trusted USD/USDC reward amount could be parsed");\n    db.close();\n  });\n\n'''
          if test not in text:
              if marker not in text:
                  raise SystemExit("GitHub regression test insertion point not found")
              p.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Commit final acquisition correctness changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/business/acquisition.ts src/heartbeat/daemon.ts src/__tests__/opportunity-acquisition.test.ts
          git commit -m "fix: make opportunity revenue evidence conservative"
          git push
