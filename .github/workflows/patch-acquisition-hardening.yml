name: Refine acquisition sanitization patch

on:
  push:
    branches: [feat/opportunity-acquisition]
    paths: [.github/workflows/patch-acquisition-hardening.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opportunity-acquisition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refine marketplace text handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/business/acquisition.ts")
          text = p.read_text()
          old = '''function cleanExternalText(value: unknown, maxLength: number, source: string): string {\n  if (value === null || value === undefined) return "";\n  const raw = String(value);\n  const sanitized = sanitizeInput(raw, source, "social_message");\n  if (sanitized.blocked) return "[External content blocked by injection defense]";\n  return sanitizeToolResult(sanitized.content, maxLength).trim();\n}\n'''
          new = '''function cleanExternalText(value: unknown, maxLength: number, source: string): string {\n  if (value === null || value === undefined) return "";\n  const raw = String(value);\n  const sanitized = sanitizeInput(raw, source, "social_message");\n  if (sanitized.blocked || sanitized.threatLevel !== "low") {\n    return "[External content blocked by injection defense]";\n  }\n  return sanitizeToolResult(raw, maxLength).trim();\n}\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("cleanExternalText target not found")
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit sanitization refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/business/acquisition.ts
          git commit -m "fix: preserve safe marketplace text" || exit 0
          git push
