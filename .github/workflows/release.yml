name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag commit is contained in main
        run: |
          set -euo pipefail
          git fetch https://github.com/${GITHUB_REPOSITORY}.git main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "Release tag commit $GITHUB_SHA is contained in main."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validation:contract
      - run: pnpm run typecheck
      - run: pnpm run typecheck:tests
      - run: pnpm run build
      - name: Run complete process-isolated test suite
        env:
          TEST_FILE_TIMEOUT_MS: 120000
        run: node scripts/run-isolated-tests.mjs
      - name: Prove validation still detects known-bad behavior
        run: node scripts/verify-test-sensitivity.mjs
      - run: pnpm audit --audit-level=high
