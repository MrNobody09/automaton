name: Apply owner control integration patch

on:
  push:
    branches: [feat/owner-control-plane]
    paths: [.github/workflows/patch-owner-control.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owner-control-plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply owner control runtime integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch target not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"expected patch target not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # executeTool: durable single-use approvals for quarantined actions.
          replace_once(
              "src/agent/tools.ts",
              '''    if (decision.action !== "allow") {\n      return {\n        id: ulid(),\n        name: toolName,\n        arguments: args,\n        result: "",\n        durationMs: Date.now() - startTime,\n        error: `Policy denied: ${decision.reasonCode} — ${decision.humanMessage}`,\n      };\n    }''',
              '''    if (decision.action === "quarantine") {\n      const { consumeApprovedOwnerApproval, requestOwnerApproval } =\n        await import("../control/approvals.js");\n      const approved = consumeApprovedOwnerApproval(\n        context.db.raw,\n        toolName,\n        decision.argsHash,\n      );\n      if (!approved) {\n        const approval = requestOwnerApproval(context.db.raw, {\n          toolName,\n          argsHash: decision.argsHash,\n          args,\n          reason: `${decision.reasonCode}: ${decision.humanMessage}`,\n        });\n        const { insertWakeEvent } = await import("../state/database.js");\n        insertWakeEvent(context.db.raw, "owner_control", "approval_required", {\n          approvalId: approval.id,\n        });\n        return {\n          id: ulid(),\n          name: toolName,\n          arguments: args,\n          result: "",\n          durationMs: Date.now() - startTime,\n          error: `Policy quarantined: ${decision.reasonCode} — owner approval required (${approval.id})`,\n        };\n      }\n    } else if (decision.action !== "allow") {\n      return {\n        id: ulid(),\n        name: toolName,\n        arguments: args,\n        result: "",\n        durationMs: Date.now() - startTime,\n        error: `Policy denied: ${decision.reasonCode} — ${decision.humanMessage}`,\n      };\n    }''',
          )

          # Agent loop imports.
          replace_once(
              "src/agent/loop.ts",
              '''import { isIdleOnlyTool } from "./idle-only-tools.js";''',
              '''import { isIdleOnlyTool } from "./idle-only-tools.js";\nimport {\n  claimNextOwnerMessage,\n  isAutonomyPaused,\n  markOwnerMessageProcessed,\n  resetOwnerMessage,\n  type OwnerMessage,\n} from "../control/state.js";''',
          )

          # Orchestration spawn path must use actual runtime config too.
          replace_all(
              "src/agent/loop.ts",
              '''await spawnChild(conway, identity, db, genesis, lifecycle);''',
              '''await spawnChild(conway, identity, db, genesis, lifecycle, config);''',
          )
          replace_all(
              "src/agent/loop.ts",
              '''await retrySpawn(conway, identity, db, retryGenesis, retryLifecycle);''',
              '''await retrySpawn(conway, identity, db, retryGenesis, retryLifecycle, config);''',
          )

          # Track owner message claim alongside inbox claims.
          replace_once(
              "src/agent/loop.ts",
              '''    let claimedMessages: InboxMessageRow[] = [];\n\n    try {''',
              '''    let claimedMessages: InboxMessageRow[] = [];\n    let claimedOwnerMessage: OwnerMessage | undefined;\n\n    try {''',
          )

          # Immediate autonomy pause at turn boundaries.
          replace_once(
              "src/agent/loop.ts",
              '''    try {\n      // Check if we should be sleeping''',
              '''    try {\n      if (isAutonomyPaused(db.raw)) {\n        log(config, "[OWNER CONTROL] Autonomy paused by owner.");\n        db.setAgentState("sleeping");\n        onStateChange?.("sleeping");\n        running = false;\n        break;\n      }\n\n      // Check if we should be sleeping''',
          )

          # Creator message takes precedence over social inbox.
          replace_once(
              "src/agent/loop.ts",
              '''      // Check for unprocessed inbox messages using the state machine:\n      // received → in_progress (claim) → processed (on success) or received/failed (on failure)\n      if (!pendingInput) {''',
              '''      if (!pendingInput) {\n        claimedOwnerMessage = claimNextOwnerMessage(db.raw);\n        if (claimedOwnerMessage) {\n          pendingInput = {\n            content: `[Owner instruction]: ${claimedOwnerMessage.content}`,\n            source: "creator",\n          };\n        }\n      }\n\n      // Check for unprocessed inbox messages using the state machine:\n      // received → in_progress (claim) → processed (on success) or received/failed (on failure)\n      if (!pendingInput) {''',
          )

          # Mark owner message processed atomically with turn persistence.
          replace_once(
              "src/agent/loop.ts",
              '''        if (claimedIds.length > 0) {\n          markInboxProcessed(db.raw, claimedIds);\n        }\n      });''',
              '''        if (claimedIds.length > 0) {\n          markInboxProcessed(db.raw, claimedIds);\n        }\n        if (claimedOwnerMessage) {\n          markOwnerMessageProcessed(db.raw, claimedOwnerMessage.id);\n        }\n      });''',
          )

          # Restore creator message to pending if the turn fails.
          replace_once(
              "src/agent/loop.ts",
              '''      // Handle inbox message state on turn failure:\n      // Messages that have retries remaining go back to 'received';''',
              '''      if (claimedOwnerMessage) {\n        resetOwnerMessage(db.raw, claimedOwnerMessage.id, err.message || String(err));\n      }\n\n      // Handle inbox message state on turn failure:\n      // Messages that have retries remaining go back to 'received';''',
          )

          # Child creation emergency control at the actual spawn boundary.
          replace_once(
              "src/replication/spawn.ts",
              '''import { propagateConstitution } from "./constitution.js";''',
              '''import { propagateConstitution } from "./constitution.js";\nimport { isChildCreationPaused } from "../control/state.js";''',
          )
          replace_once(
              "src/replication/spawn.ts",
              '''  assertChildCapacity(db.getChildren(), runtimeConfig?.maxChildren ?? 3);''',
              '''  if (isChildCreationPaused(db.raw)) {\n    throw new Error("Child creation is disabled by owner emergency control");\n  }\n  assertChildCapacity(db.getChildren(), runtimeConfig?.maxChildren ?? 3);''',
          )

          # Runtime control server + outer autonomy pause.
          replace_once(
              "src/index.ts",
              '''import { randomUUID } from "crypto";''',
              '''import { randomUUID } from "crypto";\nimport { createOwnerControlServer } from "./control/server.js";\nimport { initializeOwnerControlSchema, isAutonomyPaused } from "./control/state.js";\nimport { initializeOwnerApprovalSchema } from "./control/approvals.js";''',
          )
          replace_once(
              "src/index.ts",
              '''  const db = createDatabase(dbPath);''',
              '''  const db = createDatabase(dbPath);\n  initializeOwnerControlSchema(db.raw);\n  initializeOwnerApprovalSchema(db.raw);''',
          )
          replace_once(
              "src/index.ts",
              '''  heartbeat.start();\n  logger.info(`[${new Date().toISOString()}] Heartbeat daemon started.`);\n\n  // Handle graceful shutdown''',
              '''  heartbeat.start();\n  logger.info(`[${new Date().toISOString()}] Heartbeat daemon started.`);\n\n  let ownerControlServer: ReturnType<typeof createOwnerControlServer> | undefined;\n  const ownerControlToken = process.env.OWNER_CONTROL_TOKEN;\n  if (ownerControlToken) {\n    const host = process.env.OWNER_CONTROL_HOST || "127.0.0.1";\n    const parsedPort = Number(process.env.OWNER_CONTROL_PORT || "8787");\n    const port = Number.isInteger(parsedPort) && parsedPort > 0 && parsedPort <= 65535\n      ? parsedPort\n      : 8787;\n    ownerControlServer = createOwnerControlServer({ db, config, token: ownerControlToken, host, port });\n    logger.info(`[${new Date().toISOString()}] Owner control plane listening on ${host}:${port}`);\n  } else {\n    logger.warn("OWNER_CONTROL_TOKEN is not set; owner control plane is disabled.");\n  }\n\n  // Handle graceful shutdown''',
          )
          replace_once(
              "src/index.ts",
              '''    heartbeat.stop();\n    db.setAgentState("sleeping");''',
              '''    heartbeat.stop();\n    ownerControlServer?.close();\n    db.setAgentState("sleeping");''',
          )
          replace_once(
              "src/index.ts",
              '''  while (true) {\n    try {\n      // Reload skills''',
              '''  while (true) {\n    try {\n      if (isAutonomyPaused(db.raw)) {\n        if (db.getAgentState() !== "sleeping") db.setAgentState("sleeping");\n        await sleep(5_000);\n        continue;\n      }\n\n      // Reload skills''',
          )

          # Production environment template.
          p = Path("deploy/automaton.env.example")
          text = p.read_text()
          block = '''\n# Owner Control Plane (token must be at least 32 characters)\n# OWNER_CONTROL_TOKEN=\n# OWNER_CONTROL_HOST=127.0.0.1\n# OWNER_CONTROL_PORT=8787\n'''
          if "OWNER_CONTROL_TOKEN" not in text:
              p.write_text(text.rstrip() + "\n" + block)
          PY
      - name: Commit owner control integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/tools.ts src/agent/loop.ts src/replication/spawn.ts src/index.ts deploy/automaton.env.example
          git commit -m "feat: integrate owner control plane into runtime"
          git push
