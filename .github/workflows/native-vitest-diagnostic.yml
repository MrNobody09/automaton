name: Native Vitest Diagnostic

on:
  push:
    branches: [diagnostic/native-vitest-root-cause]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-vitest:
    name: native-vitest (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            args: ""
          - mode: serial-threads
            args: "--pool=threads --fileParallelism=false --maxWorkers=1"
          - mode: serial-forks
            args: "--pool=forks --fileParallelism=false --maxWorkers=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - run: pnpm install --frozen-lockfile
      - name: Run native Vitest with hard diagnostic timeout
        shell: bash
        run: |
          set +e
          echo "=== mode=${{ matrix.mode }} ==="
          START=$(date +%s)
          timeout --signal=TERM --kill-after=10s 240s pnpm exec vitest run --reporter=verbose ${{ matrix.args }}
          RC=$?
          END=$(date +%s)
          echo "=== mode=${{ matrix.mode }} exit=$RC elapsed=$((END-START))s ==="
          if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
            echo "RESULT=HUNG_OR_TIMEOUT"
          elif [ "$RC" -eq 0 ]; then
            echo "RESULT=CLEAN_EXIT"
          else
            echo "RESULT=TEST_OR_RUNTIME_FAILURE"
          fi
          exit 0
