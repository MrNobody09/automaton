# CI validation for the Automaton fork
name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run PR1-PR5 regression suite
        run: pnpm run test:regression
      - name: Run security regression suite
        run: pnpm run test:security
      - name: Run financial regression suite
        run: pnpm run test:financial

  full-suite-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Run full-suite shard ${{ matrix.shard }}/4
        timeout-minutes: 4
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  lifecycle-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - src/__tests__/orchestration/health-monitor.test.ts
          - src/__tests__/policy-engine.test.ts
          - src/__tests__/memory.test.ts
          - src/__tests__/integration/inference-failover.test.ts
          - src/__tests__/orchestration/plan-mode.test.ts
          - src/__tests__/inbox-processing.test.ts
          - src/__tests__/inference/provider-registry.test.ts
          - src/__tests__/orchestration/planner.test.ts
          - src/__tests__/memory/enhanced-retriever.test.ts
          - src/__tests__/memory/event-stream.test.ts
          - src/__tests__/agent/general-harness.test.ts
          - src/__tests__/agent/loop-detector.test.ts
          - src/__tests__/siws.test.ts
          - src/__tests__/wallet-solana.test.ts
          - src/__tests__/social.test.ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Isolate ${{ matrix.test-file }}
        timeout-minutes: 2
        run: pnpm exec vitest run ${{ matrix.test-file }}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
