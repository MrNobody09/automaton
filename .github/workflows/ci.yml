# CI validation for the Automaton fork
name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run opportunity acquisition regression tests
        run: pnpm exec vitest run src/__tests__/opportunity-acquisition.test.ts --reporter=verbose
      - name: Run tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 pnpm test 2>&1 | tee /tmp/vitest-full.log
          RC=${PIPESTATUS[0]}
          set -e

          # A known open-handle issue can keep Vitest alive after it has printed its
          # final summary. Never allow that timeout to hide an actual failed suite.
          if grep -Eq '(Test Files|Tests)[[:space:]].*[1-9][0-9]* failed' /tmp/vitest-full.log; then
            echo "::error::Vitest reported one or more failed tests"
            exit 1
          fi

          if [ $RC -eq 124 ]; then
            if ! grep -Eq 'Tests[[:space:]]+[0-9]+ passed' /tmp/vitest-full.log; then
              echo "::error::Vitest timed out before reporting a passing test summary"
              exit 1
            fi
            echo "::warning::vitest process hung after tests, killed by timeout"
            exit 0
          fi
          exit $RC
      - name: Run security tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 180 pnpm test -- --grep "security|injection|policy|financial" 2>&1 | tee /tmp/vitest-security.log
          RC=${PIPESTATUS[0]}
          set -e

          if grep -Eq '(Test Files|Tests)[[:space:]].*[1-9][0-9]* failed' /tmp/vitest-security.log; then
            echo "::error::Vitest reported one or more failed security tests"
            exit 1
          fi

          if [ $RC -eq 124 ]; then
            if ! grep -Eq 'Tests[[:space:]]+[0-9]+ passed' /tmp/vitest-security.log; then
              echo "::error::Security tests timed out before reporting a passing test summary"
              exit 1
            fi
            echo "::warning::vitest process hung after tests, killed by timeout"
            exit 0
          fi
          exit $RC

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
