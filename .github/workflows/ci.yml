# CI validation for the Automaton fork
name: CI
run-name: CI · ${{ github.event_name }} · head=${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify PR merge ref identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          read -r BASE_PARENT HEAD_PARENT <<< "$(git show -s --format=%P HEAD)"
          test "$HEAD_PARENT" = "$EXPECTED_HEAD"
          test "$BASE_PARENT" = "$EXPECTED_BASE"
          echo "Validated synthetic merge commit $(git rev-parse HEAD): base=$BASE_PARENT head=$HEAD_PARENT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validation:contract

  build-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:tests
      - run: pnpm run build
      - run: pnpm run validation:artifacts

  isolated-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - run: pnpm install --frozen-lockfile
      - name: Run isolated full-suite shard ${{ matrix.shard }}/4 on Node ${{ matrix.node-version }}
        env:
          TEST_FILE_TIMEOUT_MS: 120000
        run: pnpm exec tsx scripts/run-isolated-tests.ts ${{ matrix.shard }} 4

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  required-ci:
    name: required-ci
    if: always()
    needs:
      - validation-contract
      - build-and-typecheck
      - isolated-full-suite
      - security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Require all authoritative CI jobs
        env:
          VALIDATION_CONTRACT_RESULT: ${{ needs.validation-contract.result }}
          BUILD_AND_TYPECHECK_RESULT: ${{ needs.build-and-typecheck.result }}
          ISOLATED_FULL_SUITE_RESULT: ${{ needs.isolated-full-suite.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
        run: |
          set -euo pipefail
          printf 'validation-contract=%s\nbuild-and-typecheck=%s\nisolated-full-suite=%s\nsecurity-audit=%s\n' \
            "$VALIDATION_CONTRACT_RESULT" \
            "$BUILD_AND_TYPECHECK_RESULT" \
            "$ISOLATED_FULL_SUITE_RESULT" \
            "$SECURITY_AUDIT_RESULT"
          test "$VALIDATION_CONTRACT_RESULT" = "success"
          test "$BUILD_AND_TYPECHECK_RESULT" = "success"
          test "$ISOLATED_FULL_SUITE_RESULT" = "success"
          test "$SECURITY_AUDIT_RESULT" = "success"
